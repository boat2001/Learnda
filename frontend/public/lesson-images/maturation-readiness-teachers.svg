<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="mrt-title">
  <title id="mrt-title">Maturation and Teaching Readiness mind map</title>
  <!-- Background -->
  <rect width="820" height="470" fill="#f8faff" rx="16"/>

  <!-- Title -->
  <text x="410" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1a2e5a">Maturation &amp; Teaching Readiness</text>
  <text x="410" y="57" text-anchor="middle" font-size="13" fill="#64748b">What teachers must understand about maturation</text>
  <line x1="50" y1="68" x2="770" y2="68" stroke="#d0d8f0" stroke-width="1.5"/>

  <!-- Connecting lines to boxes -->
  <line x1="330" y1="172" x2="242" y2="148" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="490" y1="172" x2="576" y2="148" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="330" y1="238" x2="242" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="490" y1="238" x2="576" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="410" y1="260" x2="410" y2="322" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="410" y1="150" x2="410" y2="140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Central concept -->
  <ellipse cx="410" cy="205" rx="88" ry="55" fill="#1a2e5a"/>
  <text x="410" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MATURATION</text>
  <text x="410" y="218" text-anchor="middle" font-size="11" fill="#93c5fd">Influences Readiness</text>

  <!-- Box: What is maturation? (top center) -->
  <rect x="288" y="76" width="244" height="64" rx="10" fill="#1e40af"/>
  <text x="410" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">What is Maturation?</text>
  <text x="410" y="114" text-anchor="middle" font-size="11" fill="#bfdbfe">Gradual biological development of</text>
  <text x="410" y="130" text-anchor="middle" font-size="11" fill="#bfdbfe">physical, psychological &amp; social features</text>

  <!-- Box: What matures (top left) -->
  <rect x="50" y="84" width="192" height="132" rx="10" fill="#fff3e0" stroke="#f97316" stroke-width="2"/>
  <text x="146" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">What Matures?</text>
  <text x="68" y="128" font-size="11" fill="#9a3412">🧠 Nervous system</text>
  <text x="68" y="148" font-size="11" fill="#9a3412">👁️ Sense organs</text>
  <text x="68" y="168" font-size="11" fill="#9a3412">🤸 Psychomotor skills</text>
  <text x="68" y="188" font-size="11" fill="#9a3412">💡 Intellectual functions</text>
  <text x="68" y="208" font-size="11" fill="#9a3412">❤️ Emotional responses</text>

  <!-- Box: Signs of NOT ready (top right) -->
  <rect x="578" y="84" width="192" height="100" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="674" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Not Ready Signs:</text>
  <text x="596" y="128" font-size="11" fill="#7f1d1d">😡 Frustration &amp; anger</text>
  <text x="596" y="148" font-size="11" fill="#7f1d1d">😢 Crying / shutting down</text>
  <text x="596" y="168" font-size="11" fill="#7f1d1d">❌ Inability to perform</text>

  <!-- Box: Signs of READY (bottom left) -->
  <rect x="50" y="244" width="192" height="96" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="146" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Ready Signs:</text>
  <text x="68" y="288" font-size="11" fill="#166534">✅ Rapid progress</text>
  <text x="68" y="308" font-size="11" fill="#166534">✅ Eagerness to learn</text>
  <text x="68" y="328" font-size="11" fill="#166534">✅ Focused attention</text>

  <!-- Box: Teacher actions (bottom right) -->
  <rect x="578" y="244" width="192" height="108" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="674" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">Teacher Actions:</text>
  <text x="596" y="288" font-size="11" fill="#581c87">🎯 Match tasks to stage</text>
  <text x="596" y="308" font-size="11" fill="#581c87">📚 Use age-appropriate</text>
  <text x="612" y="324" font-size="11" fill="#581c87">materials</text>
  <text x="596" y="344" font-size="11" fill="#581c87">⏳ Don't rush learning</text>

  <!-- Bottom key message -->
  <rect x="284" y="322" width="252" height="92" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="410" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Key Principle for Teachers:</text>
  <text x="410" y="364" text-anchor="middle" font-size="11" fill="#78350f">You cannot force maturation.</text>
  <text x="410" y="382" text-anchor="middle" font-size="11" fill="#78350f">Align instruction with the</text>
  <text x="410" y="400" text-anchor="middle" font-size="11" fill="#78350f">child's maturation level.</text>

  <!-- Footer -->
  <text x="410" y="456" text-anchor="middle" font-size="10" fill="#94a3b8">Sharether Learning Platform • Lesson 1: Growth, Development &amp; Maturation</text>
</svg>
