<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A curve with a tangent line that can be placed on a rising part (positive gradient), a peak (zero gradient), or a falling part (negative gradient). The normal line is perpendicular to the tangent.">
  <title>Gradients, Tangents and Normal Lines</title>
  <style>
    .ct-title { font-family:'Segoe UI',system-ui,sans-serif; font-weight:700; }
    .ct-body  { font-family:'Segoe UI',system-ui,sans-serif; }
    .pt { display:none; }
    .pt.show { display:block; }
    .gbtn { cursor:pointer; }
    .gbtn .gbx { fill:#ffffff; stroke:#1a2e5a; stroke-width:1.4; }
    .gbtn .gtx { fill:#1a2e5a; }
    .gbtn.is-active .gbx { fill:#1a2e5a; }
    .gbtn.is-active .gtx { fill:#ffffff; }
  </style>

  <rect x="0" y="0" width="480" height="540" rx="16" fill="#f8faff"/>
  <rect x="16" y="16" width="448" height="50" rx="12" fill="#1a2e5a"/>
  <text class="ct-title" x="240" y="40" text-anchor="middle" fill="#ffffff" font-size="18">Gradients, Tangents &amp; Normal Lines</text>
  <text class="ct-body" x="240" y="58" text-anchor="middle" fill="#aebfe0" font-size="12.5">Tap a point to read the gradient there</text>

  <!-- graph frame -->
  <rect x="40" y="86" width="400" height="300" rx="12" fill="#ffffff" stroke="#dbe3f1" stroke-width="1.3"/>
  <!-- axes -->
  <line x1="70" y1="362" x2="430" y2="362" stroke="#94a3b8" stroke-width="1.6"/><path d="M438 362 L428 357 L428 367 Z" fill="#94a3b8"/>
  <line x1="72" y1="376" x2="72" y2="104" stroke="#94a3b8" stroke-width="1.6"/><path d="M72 96 L67 106 L77 106 Z" fill="#94a3b8"/>
  <text class="ct-body" x="432" y="380" fill="#94a3b8" font-size="12">x</text>
  <text class="ct-body" x="58" y="104" fill="#94a3b8" font-size="12">y</text>

  <!-- curve -->
  <path d="M72 332 C120 332 150 168 200 168 C250 168 248 330 300 330 C346 330 392 250 424 206" fill="none" stroke="#1a2e5a" stroke-width="3"/>

  <!-- RISING -->
  <g id="pt-rising" class="pt">
    <line x1="96" y1="286" x2="180" y2="206" stroke="#f97316" stroke-width="2.6"/>
    <line x1="106" y1="226" x2="158" y2="276" stroke="#4f7f7b" stroke-width="1.6" stroke-dasharray="5 4"/>
    <circle cx="132" cy="246" r="5.5" fill="#dc2626"/>
    <text class="ct-title" x="150" y="238" fill="#c2410c" font-size="13">gradient &gt; 0</text>
  </g>
  <!-- PEAK -->
  <g id="pt-peak" class="pt">
    <line x1="150" y1="168" x2="252" y2="168" stroke="#f97316" stroke-width="2.6"/>
    <line x1="200" y1="140" x2="200" y2="210" stroke="#4f7f7b" stroke-width="1.6" stroke-dasharray="5 4"/>
    <circle cx="200" cy="168" r="5.5" fill="#dc2626"/>
    <text class="ct-title" x="212" y="158" fill="#c2410c" font-size="13">gradient = 0</text>
  </g>
  <!-- FALLING -->
  <g id="pt-falling" class="pt">
    <line x1="226" y1="212" x2="310" y2="288" stroke="#f97316" stroke-width="2.6"/>
    <line x1="242" y1="288" x2="294" y2="236" stroke="#4f7f7b" stroke-width="1.6" stroke-dasharray="5 4"/>
    <circle cx="268" cy="250" r="5.5" fill="#dc2626"/>
    <text class="ct-title" x="284" y="244" fill="#c2410c" font-size="13">gradient &lt; 0</text>
  </g>

  <!-- legend inside frame -->
  <line x1="280" y1="346" x2="306" y2="346" stroke="#f97316" stroke-width="2.6"/><text class="ct-body" x="312" y="350" fill="#64748b" font-size="11">tangent</text>
  <line x1="364" y1="346" x2="390" y2="346" stroke="#4f7f7b" stroke-width="1.6" stroke-dasharray="5 4"/><text class="ct-body" x="396" y="350" fill="#64748b" font-size="11">normal</text>

  <!-- buttons -->
  <g class="gbtn" data-pt="rising" tabindex="0">
    <rect class="gbx" x="40" y="400" width="128" height="34" rx="9"/>
    <text class="gtx ct-title" x="104" y="422" text-anchor="middle" font-size="13">Rising</text>
  </g>
  <g class="gbtn" data-pt="peak" tabindex="0">
    <rect class="gbx" x="176" y="400" width="128" height="34" rx="9"/>
    <text class="gtx ct-title" x="240" y="422" text-anchor="middle" font-size="13">Peak (max)</text>
  </g>
  <g class="gbtn" data-pt="falling" tabindex="0">
    <rect class="gbx" x="312" y="400" width="128" height="34" rx="9"/>
    <text class="gtx ct-title" x="376" y="422" text-anchor="middle" font-size="13">Falling</text>
  </g>

  <!-- readout -->
  <rect x="40" y="444" width="400" height="50" rx="11" fill="#eef2fb" stroke="#c7d2e8" stroke-width="1.2"/>
  <text id="ct-read" class="ct-body" x="56" y="466" fill="#1e293b" font-size="13">Rising part &#8212; the tangent slopes up, so the gradient is positive.</text>
  <text class="ct-body" x="56" y="486" fill="#64748b" font-size="12">Gradient = dy/dx &#183; the normal is perpendicular to the tangent.</text>

  <text class="ct-body" x="240" y="520" text-anchor="middle" fill="#94a3b8" font-size="11">Learnda Learning Platform &#8226; EBS 301J &#8226; Lesson 6: Derivatives in Action</text>

  <script><![CDATA[
    (function () {
      var svg = document.currentScript.closest('svg');
      var msg = {
        rising:  "Rising part — the tangent slopes up, so the gradient is positive.",
        peak:    "At a peak (maximum) the tangent is flat, so the gradient is zero.",
        falling: "Falling part — the tangent slopes down, so the gradient is negative."
      };
      var read = svg.querySelector('#ct-read');
      function show(pt) {
        svg.querySelectorAll('.pt').forEach(function (g) { g.classList.remove('show'); });
        var el = svg.querySelector('#pt-' + pt); if (el) el.classList.add('show');
        svg.querySelectorAll('.gbtn').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-pt') === pt); });
        read.textContent = msg[pt];
      }
      svg.querySelectorAll('.gbtn').forEach(function (b) {
        var pt = b.getAttribute('data-pt');
        b.addEventListener('click', function () { show(pt); });
        b.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(pt); } });
      });
      show('rising');
    })();
  ]]></script>
</svg>
