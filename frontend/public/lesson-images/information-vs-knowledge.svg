<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 548" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The ladder from data to information to knowledge to wisdom, each adding context, meaning or judgement, with a worked weather example.">
  <title>From Data to Knowledge</title>
  <style>
    .iv-title { font-family:'Segoe UI',system-ui,sans-serif; font-weight:700; }
    .iv-body  { font-family:'Segoe UI',system-ui,sans-serif; }
    .rung { cursor:pointer; }
    .rung .ring { fill:none; opacity:0; transition:opacity .16s ease; }
    .rung:hover .ring, .rung.is-active .ring { opacity:1; }
  </style>

  <rect x="0" y="0" width="480" height="548" rx="16" fill="#f8faff"/>
  <rect x="16" y="16" width="448" height="50" rx="12" fill="#1a2e5a"/>
  <text class="iv-title" x="240" y="40" text-anchor="middle" fill="#ffffff" font-size="18">From Data to Knowledge</text>
  <text class="iv-body" x="240" y="58" text-anchor="middle" fill="#aebfe0" font-size="12.5">Information and knowledge are NOT the same thing</text>

  <!-- up arrow -->
  <line x1="46" y1="490" x2="46" y2="100" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M46 92 L40 104 L52 104 Z" fill="#cbd5e1"/>

  <!-- Wisdom (top) -->
  <g class="rung" tabindex="0">
    <rect class="ring" x="72" y="92" width="388" height="80" rx="13" stroke="#8b5cf6" stroke-width="3"/>
    <rect x="76" y="96" width="384" height="72" rx="11" fill="#f3effe" stroke="#c4b5fd" stroke-width="1.4"/>
    <rect x="76" y="96" width="6" height="72" rx="3" fill="#8b5cf6"/>
    <text class="iv-title" x="94" y="120" fill="#6d28d9" font-size="15">Wisdom</text>
    <text class="iv-body" x="94" y="139" fill="#475569" font-size="12.5">Knowing what is worth doing</text>
    <text class="iv-body" x="94" y="157" fill="#94a3b8" font-size="12">e.g. adjust the timetable for pupils' wellbeing</text>
  </g>
  <text class="iv-body" x="60" y="186" fill="#8b5cf6" font-size="11">+ judgement</text>

  <!-- Knowledge -->
  <g class="rung" tabindex="0">
    <rect class="ring" x="72" y="196" width="388" height="80" rx="13" stroke="#5b8439" stroke-width="3"/>
    <rect x="76" y="200" width="384" height="72" rx="11" fill="#ecfdf5" stroke="#86efac" stroke-width="1.4"/>
    <rect x="76" y="200" width="6" height="72" rx="3" fill="#5b8439"/>
    <text class="iv-title" x="94" y="224" fill="#166534" font-size="15">Knowledge</text>
    <text class="iv-body" x="94" y="243" fill="#475569" font-size="12.5">Information understood and applied</text>
    <text class="iv-body" x="94" y="261" fill="#94a3b8" font-size="12">e.g. it's hot season &#8212; teach outdoors early</text>
  </g>
  <text class="iv-body" x="60" y="290" fill="#5b8439" font-size="11">+ meaning &amp; use</text>

  <!-- Information -->
  <g class="rung" tabindex="0">
    <rect class="ring" x="72" y="300" width="388" height="80" rx="13" stroke="#3b82f6" stroke-width="3"/>
    <rect x="76" y="304" width="384" height="72" rx="11" fill="#eaf1fe" stroke="#9cc0f7" stroke-width="1.4"/>
    <rect x="76" y="304" width="6" height="72" rx="3" fill="#3b82f6"/>
    <text class="iv-title" x="94" y="328" fill="#1d4ed8" font-size="15">Information</text>
    <text class="iv-body" x="94" y="347" fill="#475569" font-size="12.5">Data placed in context</text>
    <text class="iv-body" x="94" y="365" fill="#94a3b8" font-size="12">e.g. Accra's temperatures this week (&#176;C)</text>
  </g>
  <text class="iv-body" x="60" y="394" fill="#3b82f6" font-size="11">+ context</text>

  <!-- Data (bottom) -->
  <g class="rung" tabindex="0">
    <rect class="ring" x="72" y="404" width="388" height="80" rx="13" stroke="#fab82c" stroke-width="3"/>
    <rect x="76" y="408" width="384" height="72" rx="11" fill="#fff7e6" stroke="#fcd385" stroke-width="1.4"/>
    <rect x="76" y="408" width="6" height="72" rx="3" fill="#fab82c"/>
    <text class="iv-title" x="94" y="432" fill="#b45309" font-size="15">Data</text>
    <text class="iv-body" x="94" y="451" fill="#475569" font-size="12.5">Raw facts with no meaning yet</text>
    <text class="iv-body" x="94" y="469" fill="#94a3b8" font-size="12">e.g. 27, 30, 31, 29</text>
  </g>

  <text class="iv-body" x="240" y="524" text-anchor="middle" fill="#94a3b8" font-size="11">Learnda Learning Platform &#8226; EBS 118 &#8226; Lesson 2: Information Literacy</text>

  <script><![CDATA[
    (function () {
      var svg = document.currentScript.closest('svg');
      svg.querySelectorAll('.rung').forEach(function (el) {
        el.addEventListener('click', function () {
          var on = el.classList.contains('is-active');
          svg.querySelectorAll('.rung').forEach(function (r) { r.classList.remove('is-active'); });
          if (!on) el.classList.add('is-active');
        });
      });
    })();
  ]]></script>
</svg>
