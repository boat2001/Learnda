<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="he-title">
  <title id="he-title">Heredity and Environment interact to shape development</title>
  <rect width="820" height="460" fill="#f8faff" rx="16"/>

  <text x="410" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1a2e5a">Heredity × Environment = Development</text>
  <text x="410" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">Nature and nurture work together — neither acts alone</text>
  <line x1="50" y1="70" x2="770" y2="70" stroke="#d0d8f0" stroke-width="1.5"/>

  <!-- LEFT: Heredity -->
  <rect x="60" y="95" width="280" height="220" rx="14" fill="#fdf4ff" stroke="#c026d3" stroke-width="2.5"/>
  <rect x="60" y="95" width="280" height="48" rx="14" fill="#c026d3"/>
  <rect x="60" y="125" width="280" height="18" fill="#c026d3"/>
  <text x="200" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">🧬 HEREDITY (Nature)</text>
  <text x="200" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a21caf">What the child is born with</text>
  <text x="82" y="192" font-size="11" fill="#86198f">• Genes from both parents</text>
  <text x="82" y="212" font-size="11" fill="#86198f">• Sets the potential (e.g. height range)</text>
  <text x="82" y="232" font-size="11" fill="#86198f">• Eye colour, blood group, temperament</text>
  <text x="82" y="252" font-size="11" fill="#86198f">• Some abilities &amp; health conditions</text>
  <rect x="78" y="268" width="244" height="32" rx="8" fill="#f5d0fe"/>
  <text x="200" y="288" text-anchor="middle" font-size="10.5" font-weight="600" fill="#701a75">Fixed at conception — the blueprint</text>

  <!-- RIGHT: Environment -->
  <rect x="480" y="95" width="280" height="220" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="480" y="95" width="280" height="48" rx="14" fill="#16a34a"/>
  <rect x="480" y="125" width="280" height="18" fill="#16a34a"/>
  <text x="620" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">🌍 ENVIRONMENT (Nurture)</text>
  <text x="620" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#15803d">What surrounds the child</text>
  <text x="502" y="192" font-size="11" fill="#166534">• Nutrition and health care</text>
  <text x="502" y="212" font-size="11" fill="#166534">• Family, school and community</text>
  <text x="502" y="232" font-size="11" fill="#166534">• Stimulation, play and language heard</text>
  <text x="502" y="252" font-size="11" fill="#166534">• Culture, experiences, opportunities</text>
  <rect x="498" y="268" width="244" height="32" rx="8" fill="#bbf7d0"/>
  <text x="620" y="288" text-anchor="middle" font-size="10.5" font-weight="600" fill="#14532d">Decides how far the potential is reached</text>

  <!-- Interaction arrows -->
  <line x1="344" y1="180" x2="476" y2="180" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="474,174 488,180 474,186" fill="#64748b"/>
  <polygon points="346,174 332,180 346,186" fill="#64748b"/>
  <text x="410" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">interact</text>

  <!-- Result -->
  <line x1="200" y1="318" x2="380,358" stroke="none"/>
  <path d="M 200,318 Q 230,360 380,372" fill="none" stroke="#c026d3" stroke-width="2" stroke-dasharray="5,3"/>
  <path d="M 620,318 Q 590,360 440,372" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="280" y="350" width="260" height="64" rx="14" fill="#1a2e5a"/>
  <text x="410" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">THE CHILD'S DEVELOPMENT</text>
  <text x="410" y="398" text-anchor="middle" font-size="10.5" fill="#93c5fd">Example: genes set a height range; nutrition decides the final height</text>

  <text x="410" y="444" text-anchor="middle" font-size="10" fill="#94a3b8">Sharether Learning Platform • Lesson 2: Principles and Patterns of Development</text>
</svg>
