<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="pod-title">
  <title id="pod-title">Directions of development: cephalocaudal and proximodistal patterns</title>
  <style>
    .pod-card { transition: transform .2s ease, filter .2s ease; cursor: pointer; }
    .pod-card:hover, .pod-card:focus { transform: translateY(-4px); filter: drop-shadow(0 6px 8px rgba(26,46,90,.18)); outline: none; }
  </style>
  <rect width="820" height="480" fill="#f8faff" rx="16"/>

  <text x="410" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1a2e5a">Development Follows a Predictable Sequence</text>
  <text x="410" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">Two universal directions of growth — the same for every child, everywhere</text>
  <line x1="50" y1="70" x2="770" y2="70" stroke="#d0d8f0" stroke-width="1.5"/>

  <!-- LEFT: Cephalocaudal -->
  <g class="pod-card" tabindex="0">
    <rect x="60" y="90" width="330" height="330" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
    <rect x="60" y="90" width="330" height="50" rx="14" fill="#f97316"/>
    <rect x="60" y="122" width="330" height="18" fill="#f97316"/>
    <text x="225" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">CEPHALOCAUDAL</text>
    <text x="225" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">"Head to Toe" direction</text>

    <!-- Baby figure with arrow head->toe -->
    <circle cx="150" cy="210" r="26" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <circle cx="142" cy="204" r="3.5" fill="#7c2d12"/>
    <circle cx="158" cy="204" r="3.5" fill="#7c2d12"/>
    <path d="M 142,219 Q 150,224 158,219" fill="none" stroke="#7c2d12" stroke-width="2"/>
    <rect x="132" y="240" width="36" height="60" rx="14" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <line x1="138" y1="304" x2="136" y2="350" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
    <line x1="162" y1="304" x2="164" y2="350" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
    <!-- Direction arrow -->
    <line x1="205" y1="190" x2="205" y2="340" stroke="#ea580c" stroke-width="3.5"/>
    <polygon points="197,338 205,356 213,338" fill="#ea580c"/>
    <text x="218" y="200" font-size="10.5" fill="#9a3412" font-weight="600">Head first</text>
    <text x="218" y="350" font-size="10.5" fill="#9a3412" font-weight="600">Legs last</text>

    <text x="248" y="230" font-size="11" fill="#7c2d12" font-weight="600">Order of control:</text>
    <text x="248" y="250" font-size="11" fill="#9a3412">1. Head &amp; neck</text>
    <text x="248" y="270" font-size="11" fill="#9a3412">2. Arms &amp; trunk</text>
    <text x="248" y="290" font-size="11" fill="#9a3412">3. Legs &amp; feet</text>

    <rect x="80" y="372" width="290" height="34" rx="8" fill="#fed7aa"/>
    <text x="225" y="386" text-anchor="middle" font-size="10.5" fill="#7c2d12" font-weight="600">A baby lifts its head before it sits,</text>
    <text x="225" y="400" text-anchor="middle" font-size="10.5" fill="#7c2d12">and sits before it walks.</text>
  </g>

  <!-- RIGHT: Proximodistal -->
  <g class="pod-card" tabindex="0">
    <rect x="430" y="90" width="330" height="330" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="430" y="90" width="330" height="50" rx="14" fill="#3b82f6"/>
    <rect x="430" y="122" width="330" height="18" fill="#3b82f6"/>
    <text x="595" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">PROXIMODISTAL</text>
    <text x="595" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">"Centre to Outwards" direction</text>

    <!-- Torso with arrows out to hands -->
    <rect x="555" y="200" width="80" height="110" rx="24" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <text x="595" y="262" text-anchor="middle" font-size="10.5" fill="#1e3a8a" font-weight="600">trunk</text>
    <!-- Arrows out -->
    <line x1="552" y1="250" x2="492" y2="250" stroke="#2563eb" stroke-width="3.5"/>
    <polygon points="494,242 476,250 494,258" fill="#2563eb"/>
    <line x1="638" y1="250" x2="698" y2="250" stroke="#2563eb" stroke-width="3.5"/>
    <polygon points="696,242 714,250 696,258" fill="#2563eb"/>
    <text x="484" y="232" text-anchor="middle" font-size="10.5" fill="#1e40af" font-weight="600">to fingers</text>
    <text x="706" y="232" text-anchor="middle" font-size="10.5" fill="#1e40af" font-weight="600">to fingers</text>

    <text x="595" y="335" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="600">Order of control:</text>
    <text x="595" y="354" text-anchor="middle" font-size="11" fill="#1e40af">1. Shoulder → 2. Arm → 3. Hand → 4. Fingers</text>

    <rect x="450" y="372" width="290" height="34" rx="8" fill="#bfdbfe"/>
    <text x="595" y="386" text-anchor="middle" font-size="10.5" fill="#1e3a8a" font-weight="600">A child controls the whole arm before</text>
    <text x="595" y="400" text-anchor="middle" font-size="10.5" fill="#1e3a8a">the fingers — scribbling before writing.</text>
  </g>

  <text x="410" y="446" text-anchor="middle" font-size="10.5" fill="#64748b" font-style="italic">Tip: hover or tap each card • Development is orderly — never random.</text>
  <text x="410" y="466" text-anchor="middle" font-size="10" fill="#94a3b8">Sharether Learning Platform • Lesson 2: Principles and Patterns of Development</text>
</svg>
