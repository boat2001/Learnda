<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="gc-title">
  <title id="gc-title">The Human Growth Curve from birth to adulthood</title>
  <rect width="760" height="440" fill="#f8faff" rx="16"/>

  <text x="380" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1a2e5a">The Human Growth Curve</text>
  <text x="380" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">Growth is rapid in infancy, steady in childhood, and surges again at adolescence</text>
  <line x1="50" y1="70" x2="710" y2="70" stroke="#d0d8f0" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="90" y1="360" x2="690" y2="360" stroke="#1a2e5a" stroke-width="2"/>
  <polygon points="690,354 704,360 690,366" fill="#1a2e5a"/>
  <line x1="90" y1="360" x2="90" y2="95" stroke="#1a2e5a" stroke-width="2"/>
  <polygon points="84,97 90,83 96,97" fill="#1a2e5a"/>
  <text x="60" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#1a2e5a" transform="rotate(-90 60 220)">Size / Height</text>
  <text x="390" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#1a2e5a">Age (years)</text>

  <!-- Phase bands -->
  <rect x="90" y="95" width="110" height="265" fill="#fab82c" opacity="0.08"/>
  <rect x="200" y="95" width="250" height="265" fill="#73a24b" opacity="0.08"/>
  <rect x="450" y="95" width="150" height="265" fill="#8b5cf6" opacity="0.10"/>
  <rect x="600" y="95" width="90" height="265" fill="#64748b" opacity="0.08"/>

  <!-- Growth curve: steep (infancy), gentle (childhood), steep (adolescence), flat (adulthood) -->
  <path d="M 90,350 C 130,310 165,285 200,272 C 290,245 380,225 450,210 C 500,195 545,150 600,128 C 630,118 660,115 690,114"
        fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>

  <!-- Phase labels -->
  <text x="145" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">INFANCY</text>
  <text x="145" y="136" text-anchor="middle" font-size="10.5" fill="#b45309">0–2 yrs</text>
  <text x="145" y="152" text-anchor="middle" font-size="10" fill="#92400e">Very rapid growth</text>

  <text x="325" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">CHILDHOOD</text>
  <text x="325" y="136" text-anchor="middle" font-size="10.5" fill="#15803d">2–11 yrs</text>
  <text x="325" y="152" text-anchor="middle" font-size="10" fill="#166534">Slower, steady growth</text>

  <text x="525" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">ADOLESCENCE</text>
  <text x="525" y="136" text-anchor="middle" font-size="10.5" fill="#6d28d9">11–18 yrs</text>
  <text x="525" y="152" text-anchor="middle" font-size="10" fill="#5b21b6">Growth spurt!</text>

  <text x="645" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">ADULTHOOD</text>
  <text x="645" y="136" text-anchor="middle" font-size="10.5" fill="#475569">18+ yrs</text>
  <text x="645" y="152" text-anchor="middle" font-size="10" fill="#475569">Growth stops</text>

  <!-- Age ticks -->
  <line x1="200" y1="356" x2="200" y2="364" stroke="#1a2e5a" stroke-width="2"/>
  <text x="200" y="380" text-anchor="middle" font-size="11" fill="#1a2e5a">2</text>
  <line x1="450" y1="356" x2="450" y2="364" stroke="#1a2e5a" stroke-width="2"/>
  <text x="450" y="380" text-anchor="middle" font-size="11" fill="#1a2e5a">11</text>
  <line x1="600" y1="356" x2="600" y2="364" stroke="#1a2e5a" stroke-width="2"/>
  <text x="600" y="380" text-anchor="middle" font-size="11" fill="#1a2e5a">18</text>
  <text x="90" y="380" text-anchor="middle" font-size="11" fill="#1a2e5a">0</text>

  <!-- Key callout -->
  <rect x="206" y="300" width="238" height="44" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="325" y="318" text-anchor="middle" font-size="10.5" font-weight="600" fill="#075985">Growth is measurable (cm, kg) and</text>
  <text x="325" y="334" text-anchor="middle" font-size="10.5" font-weight="600" fill="#075985">has a stopping point — unlike development.</text>

  <text x="380" y="424" text-anchor="middle" font-size="10" fill="#94a3b8">Learnda Learning Platform • Lesson 1: The Concept of Growth and Development</text>
</svg>
