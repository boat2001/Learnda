<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 744" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Erikson's eight psychosocial stages from birth to late adulthood, each a crisis with a virtue. Stage 4, Industry vs Inferiority, happens in the primary classroom.">
  <title>Erikson's Eight Psychosocial Stages</title>
  <style>
    .er-title { font-family:'Segoe UI',system-ui,sans-serif; font-weight:700; }
    .er-body  { font-family:'Segoe UI',system-ui,sans-serif; }
    .stage { cursor:pointer; }
    .stage .ring { fill:none; opacity:0; transition:opacity .16s ease; }
    .stage:hover .ring, .stage.is-active .ring { opacity:1; }
  </style>

  <rect x="0" y="0" width="480" height="744" rx="16" fill="#f8faff"/>
  <rect x="16" y="16" width="448" height="50" rx="12" fill="#1a2e5a"/>
  <text class="er-title" x="240" y="40" text-anchor="middle" fill="#ffffff" font-size="18">Erikson: Eight Crises, One Lifetime</text>
  <text class="er-body" x="240" y="58" text-anchor="middle" fill="#aebfe0" font-size="12.5">Each stage resolves a crisis and earns a virtue</text>

  <!-- spine -->
  <line x1="50" y1="96" x2="50" y2="690" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Stage rows -->
  <g class="stage" tabindex="0">
    <rect class="ring" x="76" y="80" width="384" height="68" rx="12" stroke="#fab82c" stroke-width="3"/>
    <rect x="80" y="84" width="376" height="60" rx="11" fill="#ffffff" stroke="#e6ecf6" stroke-width="1.3"/>
    <circle cx="50" cy="114" r="15" fill="#fab82c"/><text class="er-title" x="50" y="119" text-anchor="middle" fill="#fff" font-size="13">1</text>
    <text class="er-title" x="96" y="110" fill="#1e293b" font-size="14">Trust vs Mistrust</text>
    <text class="er-body" x="96" y="130" fill="#64748b" font-size="12.5">Virtue: Hope</text>
    <text class="er-body" x="448" y="110" text-anchor="end" fill="#94a3b8" font-size="12">birth&#8211;18 mo</text>
  </g>
  <g class="stage" tabindex="0">
    <rect class="ring" x="76" y="156" width="384" height="68" rx="12" stroke="#f97316" stroke-width="3"/>
    <rect x="80" y="160" width="376" height="60" rx="11" fill="#ffffff" stroke="#e6ecf6" stroke-width="1.3"/>
    <circle cx="50" cy="190" r="15" fill="#f97316"/><text class="er-title" x="50" y="195" text-anchor="middle" fill="#fff" font-size="13">2</text>
    <text class="er-title" x="96" y="186" fill="#1e293b" font-size="14">Autonomy vs Shame &amp; Doubt</text>
    <text class="er-body" x="96" y="206" fill="#64748b" font-size="12.5">Virtue: Will</text>
    <text class="er-body" x="448" y="186" text-anchor="end" fill="#94a3b8" font-size="12">18 mo&#8211;3 yr</text>
  </g>
  <g class="stage" tabindex="0">
    <rect class="ring" x="76" y="232" width="384" height="68" rx="12" stroke="#f43f5e" stroke-width="3"/>
    <rect x="80" y="236" width="376" height="60" rx="11" fill="#ffffff" stroke="#e6ecf6" stroke-width="1.3"/>
    <circle cx="50" cy="266" r="15" fill="#f43f5e"/><text class="er-title" x="50" y="271" text-anchor="middle" fill="#fff" font-size="13">3</text>
    <text class="er-title" x="96" y="262" fill="#1e293b" font-size="14">Initiative vs Guilt</text>
    <text class="er-body" x="96" y="282" fill="#64748b" font-size="12.5">Virtue: Purpose</text>
    <text class="er-body" x="448" y="262" text-anchor="end" fill="#94a3b8" font-size="12">3&#8211;6 yr</text>
  </g>
  <!-- Stage 4 highlighted -->
  <g class="stage is-active" tabindex="0">
    <rect class="ring" x="76" y="308" width="384" height="68" rx="12" stroke="#3b82f6" stroke-width="3"/>
    <rect x="80" y="312" width="376" height="60" rx="11" fill="#eaf1fe" stroke="#9cc0f7" stroke-width="1.4"/>
    <circle cx="50" cy="342" r="15" fill="#3b82f6"/><text class="er-title" x="50" y="347" text-anchor="middle" fill="#fff" font-size="13">4</text>
    <text class="er-title" x="96" y="338" fill="#1e293b" font-size="14">Industry vs Inferiority</text>
    <text class="er-body" x="96" y="358" fill="#1d4ed8" font-size="12.5" font-weight="700">Virtue: Competence &#183; the primary classroom</text>
    <text class="er-body" x="448" y="338" text-anchor="end" fill="#1d4ed8" font-size="12" font-weight="700">6&#8211;12 yr</text>
  </g>
  <g class="stage" tabindex="0">
    <rect class="ring" x="76" y="384" width="384" height="68" rx="12" stroke="#6366f1" stroke-width="3"/>
    <rect x="80" y="388" width="376" height="60" rx="11" fill="#ffffff" stroke="#e6ecf6" stroke-width="1.3"/>
    <circle cx="50" cy="418" r="15" fill="#6366f1"/><text class="er-title" x="50" y="423" text-anchor="middle" fill="#fff" font-size="13">5</text>
    <text class="er-title" x="96" y="414" fill="#1e293b" font-size="14">Identity vs Role Confusion</text>
    <text class="er-body" x="96" y="434" fill="#64748b" font-size="12.5">Virtue: Fidelity</text>
    <text class="er-body" x="448" y="414" text-anchor="end" fill="#94a3b8" font-size="12">12&#8211;18 yr</text>
  </g>
  <g class="stage" tabindex="0">
    <rect class="ring" x="76" y="460" width="384" height="68" rx="12" stroke="#8b5cf6" stroke-width="3"/>
    <rect x="80" y="464" width="376" height="60" rx="11" fill="#ffffff" stroke="#e6ecf6" stroke-width="1.3"/>
    <circle cx="50" cy="494" r="15" fill="#8b5cf6"/><text class="er-title" x="50" y="499" text-anchor="middle" fill="#fff" font-size="13">6</text>
    <text class="er-title" x="96" y="490" fill="#1e293b" font-size="14">Intimacy vs Isolation</text>
    <text class="er-body" x="96" y="510" fill="#64748b" font-size="12.5">Virtue: Love</text>
    <text class="er-body" x="448" y="490" text-anchor="end" fill="#94a3b8" font-size="12">young adult</text>
  </g>
  <g class="stage" tabindex="0">
    <rect class="ring" x="76" y="536" width="384" height="68" rx="12" stroke="#a855f7" stroke-width="3"/>
    <rect x="80" y="540" width="376" height="60" rx="11" fill="#ffffff" stroke="#e6ecf6" stroke-width="1.3"/>
    <circle cx="50" cy="570" r="15" fill="#a855f7"/><text class="er-title" x="50" y="575" text-anchor="middle" fill="#fff" font-size="13">7</text>
    <text class="er-title" x="96" y="566" fill="#1e293b" font-size="14">Generativity vs Stagnation</text>
    <text class="er-body" x="96" y="586" fill="#64748b" font-size="12.5">Virtue: Care</text>
    <text class="er-body" x="448" y="566" text-anchor="end" fill="#94a3b8" font-size="12">middle adult</text>
  </g>
  <g class="stage" tabindex="0">
    <rect class="ring" x="76" y="612" width="384" height="68" rx="12" stroke="#7c3aed" stroke-width="3"/>
    <rect x="80" y="616" width="376" height="60" rx="11" fill="#ffffff" stroke="#e6ecf6" stroke-width="1.3"/>
    <circle cx="50" cy="646" r="15" fill="#7c3aed"/><text class="er-title" x="50" y="651" text-anchor="middle" fill="#fff" font-size="13">8</text>
    <text class="er-title" x="96" y="642" fill="#1e293b" font-size="14">Integrity vs Despair</text>
    <text class="er-body" x="96" y="662" fill="#64748b" font-size="12.5">Virtue: Wisdom</text>
    <text class="er-body" x="448" y="642" text-anchor="end" fill="#94a3b8" font-size="12">late adult</text>
  </g>

  <text class="er-body" x="240" y="722" text-anchor="middle" fill="#94a3b8" font-size="11">Learnda Learning Platform &#8226; EBS 106 &#8226; Lesson 11: Erikson's Psychosocial Theory</text>

  <script><![CDATA[
    (function () {
      var svg = document.currentScript.closest('svg');
      svg.querySelectorAll('.stage').forEach(function (el) {
        el.addEventListener('click', function () {
          var on = el.classList.contains('is-active');
          svg.querySelectorAll('.stage').forEach(function (s) { s.classList.remove('is-active'); });
          if (!on) el.classList.add('is-active');
        });
      });
    })();
  ]]></script>
</svg>
