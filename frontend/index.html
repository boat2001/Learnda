    <!-- Analytics: set VITE_GA_MEASUREMENT_ID to enable. Inert when unset. -->
    <script>
      (function () {
        var id = "%VITE_GA_MEASUREMENT_ID%";
        if (!id || id.charAt(0) === "%") return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];

        gtag('config', id);
      })();
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var pref = (stored === "dark" || stored === "light") ? stored : (prefersDark ? "dark" : "light");
          var root = document.documentElement;
          root.setAttribute("data-theme", pref);
          root.style.colorScheme = pref;
          root.style.backgroundColor = pref === "dark" ? "#0f1a2b" : "#fbf7ef";
          var themeColorMeta = document.getElementById("theme-color-meta");
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", pref === "dark" ? "#0f1a2b" : "#fbf7ef");
          }
        } catch (e) {
          // no-op
        }
      })();
    </script>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = document.documentElement.getAttribute('data-theme');
          var dark = t === 'dark';
          document.body.style.backgroundColor = dark ? '#0f1a2b' : '#fbf7ef';
          document.body.style.backgroundImage = 'none';
          document.body.style.transition = 'none';
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.body.style.backgroundColor = '';
              document.body.style.backgroundImage = '';
              document.body.style.transition = '';
            });
          });
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <div id="modal-root"></div>
