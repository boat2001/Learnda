    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var pref = (stored === "dark" || stored === "light") ? stored : (prefersDark ? "dark" : "light");
          var root = document.documentElement;
          root.setAttribute("data-theme", pref);
          root.style.colorScheme = pref;
          root.style.backgroundColor = pref === "dark" ? "#131b24" : "#f7f5f0";
          var themeColorMeta = document.getElementById("theme-color-meta");
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", pref === "dark" ? "#0f141c" : "#1f7177");
          }
        } catch (e) {
          // no-op
        }
      })();
    </script>

  <body>
    <script>
      (function () {
        try {
          var t = document.documentElement.getAttribute('data-theme');
          var dark = t === 'dark';
          document.body.style.backgroundColor = dark ? '#131b24' : '#f7f5f0';
          document.body.style.backgroundImage = 'none';
          document.body.style.transition = 'none';
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.body.style.backgroundColor = '';
              document.body.style.backgroundImage = '';
              document.body.style.transition = '';
            });
          });
        } catch (e) {}
      })();
    </script>
